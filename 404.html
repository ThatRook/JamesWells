<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // STRÁNKA NENALEZENA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           🎛️ HIGH-TECH MINIMALISTICKÁ 404 STRÁNKA (CSS)
           ========================================================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #050505; /* Čistá temná černá jako loader */
            overflow: hidden;
        }

        .error-page-body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-wrapper {
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .error-inner {
            width: 100%;
            max-width: 320px; /* Ostrý, kompaktní blok přesně na střed */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .error-code {
            font-family: 'Inter', sans-serif;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            color: #ffffff;
            opacity: 0.35; /* Tlumený tón jako u tvého menu */
            mix-blend-mode: difference;
            margin-bottom: 15px;
        }

        .error-line-track {
            width: 100%;
            height: 1px; /* Ultra tenká linka z loaderu */
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .error-line-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            opacity: 0.2;
        }

        .error-status {
            color: #ff3333; /* Ostrá červená ze studia */
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .error-desc {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            line-height: 1.6;
            margin: 0 0 30px 0;
            font-weight: 400;
        }

        .error-return-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
            opacity: 0.5;
            transition: opacity 0.2s ease, color 0.2s ease;
            padding: 5px 0;
            cursor: pointer;
            display: inline-block;
        }

            /* Čistá interaktivní reakce při hoveru */
            .error-return-btn:hover {
                opacity: 1;
                color: #ffffff;
            }
    </style>
</head>
<body class="error-page-body">

    <div class="error-wrapper">
        <div class="error-inner">
            <div class="error-code">404</div>

            <div class="error-line-track">
                <div class="error-line-fill"></div>
            </div>

            <div class="error-status">PAGE_NOT_FOUND</div>

            <p class="error-desc">
                Požadovaná stránka neexistuje nebo byla přesunuta. Pokračuj zpět na úvodní stranu.
            </p>

            <a href="index.html" class="error-return-btn">[ ZPĚT NA ÚVOD ]</a>
        </div>
    </div>

</body>
</html>
